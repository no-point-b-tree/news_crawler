# application.yml
server:
  port: 9008
spring:
  datasource:
    # 数据库驱动 (MySQL 8.0 使用 com.mysql.cj.jdbc.Driver)
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 数据库连接地址，database_name请替换为实际数据库名
    url: jdbc:mysql://localhost:3306/archer?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    # 数据库用户名
    username: root
    # 数据库密码
    password: root
    # 连接池配置 (以HikariCP为例，Spring Boot 2.x默认)
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

# DeepSeek AI配置
deepseek:
  api:
    # DeepSeek API端点
    url: https://api.deepseek.com/v1/chat/completions
    # API密钥，请替换为实际的API Key
    key: your-deepseek-api-key-here
    # 默认模型
    model: deepseek-chat
    # 最大token数
    max-tokens: 2000
    # 温度参数（创造性）
    temperature: 0.7
    # 请求超时时间（毫秒）
    timeout: 30000
    # 是否启用
    enabled: true
